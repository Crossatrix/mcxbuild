<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCXBuild</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen relative overflow-hidden flex flex-col">

  <!-- Main Viewport Container -->
  <main class="relative flex-1 w-full h-full overflow-hidden bg-slate-950">
    <!-- Loader Screen -->
    <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10 transition-opacity duration-300">
      <div class="w-10 h-10 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4"></div>
      <p class="text-sm text-slate-400 font-medium animate-pulse">Loading application...</p>
    </div>

    <!-- Embedded Iframe -->
    <iframe 
      id="app-frame" 
      src="https://whajsuakdhsmhskksjdjjthejobdewandeknsiefjei.lovable.app/mod" 
      title="Embedded Application" 
      class="w-full h-full border-0 relative z-10"
      sandbox="allow-downloads allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads-without-user-activation"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen
      onload="handleIframeLoad()"
      onerror="handleIframeError()">
    </iframe>
  </main>

  <!-- Interactive JavaScript logic -->
  <script>
    const iframe = document.getElementById('app-frame');
    const spinner = document.getElementById('loading-spinner');
    let loaded = false;

    // Function to handle successful iframe load
    function handleIframeLoad() {
      loaded = true;
      if (spinner) {
        spinner.classList.add('opacity-0');
        setTimeout(() => {
          spinner.style.display = 'none';
        }, 300);
      }
    }

    // Function to handle iframe error and trigger auto-refresh
    function handleIframeError() {
      window.location.reload();
    }

    // Timer fallback: If the iframe doesn't load within 8 seconds, automatically refresh the page
    setTimeout(() => {
      if (!loaded) {
        window.location.reload();
      }
    }, 8000);
  </script>
</body>
</html>
